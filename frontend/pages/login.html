<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3E6C4">
  <title>Log in | Be Accurate</title>
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/login.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/components/notifications.js" defer></script>
  <script src="../js/pages/login.js" defer></script>
</head>
<body class="login-page bg-network">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand login-brand"><span class="brand-logo login-brand-logo" aria-hidden="true"></span><span class="brand-wordmark"><span class="brand-be">Be</span><span class="brand-accurate">Accurate</span></span></div>
      <h1 id="login-title">Log in to Be Accurate</h1>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" name="email" type="email" autocomplete="username" placeholder="you@school.edu" aria-describedby="email-error"></div>
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-error"><button class="password-toggle" id="password-toggle" type="button" aria-label="Show password"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <span class="field-error" id="password-error"></span>
        </div>
        <div class="login-actions"><a href="#forgot" id="forgot-link">Forgot Password?</a><span>Don't have an account? <a href="#signup" id="signup-link">Sign Up</a></span></div>
        <button class="button button-primary button-pill button-full" type="submit">LOG IN</button>
      </form>
      <p class="demo-hint">Demo: admin@beaccurate.ai / admin123</p>
      <svg class="login-decoration login-node-decoration" viewBox="0 0 150 90" aria-hidden="true">
        <g fill="none" stroke="#D9C79A" stroke-width="1.5"><path d="M4 76 38 47 68 69 92 31 142 62M4 76 18 14 62 23 92 31M38 47 62 23 92 31 118 10"/></g>
        <g fill="#D9C79A"><circle cx="4" cy="76" r="5"/><circle cx="38" cy="47" r="4"/><circle cx="68" cy="69" r="6"/><circle cx="92" cy="31" r="5"/><circle cx="142" cy="62" r="4"/><circle cx="18" cy="14" r="3"/><circle cx="62" cy="23" r="4"/><circle cx="118" cy="10" r="3"/></g>
      </svg>
      <svg class="login-decoration login-chart-decoration" viewBox="0 0 190 90" aria-hidden="true">
        <polyline points="8,49 36,41 64,48 92,28 120,35 148,20 178,25" fill="none" stroke="#1B2A5C" stroke-width="1.5"/>
        <g fill="#1B2A5C"><circle cx="8" cy="49" r="2"/><circle cx="36" cy="41" r="2"/><circle cx="64" cy="48" r="2"/><circle cx="92" cy="28" r="2"/><circle cx="120" cy="35" r="2"/><circle cx="148" cy="20" r="2"/><circle cx="178" cy="25" r="2"/></g>
        <g fill="#1B2A5C" font-family="Roboto, sans-serif" font-size="7"><text x="4" y="68">Sun</text><text x="30" y="68">Mon</text><text x="57" y="68">Tue</text><text x="84" y="68">Wed</text><text x="112" y="68">Thu</text><text x="140" y="68">Fri</text><text x="168" y="68">Sat</text></g>
      </svg>
    </section>
    <footer class="login-footer"><nav aria-label="Legal"><a href="#terms">Terms of Use</a><a href="#privacy">Privacy Policy</a><a href="mailto:help@beaccurate.ai">Help Center</a></nav><span>© 2026 Be Accurate. All rights reserved.</span></footer>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
